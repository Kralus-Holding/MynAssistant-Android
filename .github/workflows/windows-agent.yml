name: Build MynAssistant Windows Agent

on:
  push:
    branches: ["main", "feature/android-pc-firebase-bridge"]
    paths:
      - "desktop-agent/**"
      - ".github/workflows/windows-agent.yml"
  pull_request:
    paths:
      - "desktop-agent/**"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop-agent/requirements.txt

      - name: Run Windows Agent tests
        run: python -m unittest discover -s desktop-agent/tests -v

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name MynAssistantAgent --collect-all google_auth_oauthlib --collect-all google.auth --hidden-import win32crypt desktop-agent/agent.py

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/MynAssistantAgent.exe package/
          Copy-Item desktop-agent/README.md package/README.txt
          Compress-Archive -Path package/* -DestinationPath MynAssistant-Windows-Agent.zip -Force

      - name: Upload Windows Agent package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MynAssistant-Windows-Agent
          path: MynAssistant-Windows-Agent.zip
          if-no-files-found: error
          retention-days: 7
