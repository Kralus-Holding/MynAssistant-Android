name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK signing SHA-1
        shell: bash
        run: |
          KEYSTORE_SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA1:/ { gsub(":", "", $2); print tolower($2) }')
          APK_SHA1=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk '/certificate SHA-1 digest/ { print tolower($NF) }' | tr -d ':')
          echo "Debug keystore SHA-1: $KEYSTORE_SHA1"
          echo "APK signing SHA-1:      $APK_SHA1"
          if [ -z "$KEYSTORE_SHA1" ] || [ -z "$APK_SHA1" ] || [ "$KEYSTORE_SHA1" != "$APK_SHA1" ]; then
            echo "::error::APK signing certificate does not match the stable debug keystore."
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify recovered assistant features
        shell: bash
        run: |
          test "$(grep -c 'vosk-android' app/build.gradle.kts)" -eq 1
          grep -q 'sherpa-onnx' app/build.gradle.kts
          grep -q 'android:name=".MynWakeWordService"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MynAssistantAccessibilityService"' app/src/main/AndroidManifest.xml
          VERSION_CODE=$(sed -n 's/.*versionCode = \\([0-9][0-9]*\\).*/\\1/p' app/build.gradle.kts | head -n 1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\\([^"]*\\)".*/\\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ] || [ "$VERSION_CODE" -lt 30 ]; then
            echo "::error::Invalid or unexpectedly old Android version: name=$VERSION_NAME code=$VERSION_CODE"
            exit 1
          fi
          echo "Verified app version: $VERSION_NAME (versionCode $VERSION_CODE)"
          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "Verified APK bytes: $APK_SIZE"
          if [ "$APK_SIZE" -lt 100000000 ]; then
            echo "::error::APK is unexpectedly small; verify the Vosk/Sherpa voice engine is packaged."
            exit 1
          fi

      - name: Publish APK as a prerelease asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mynassistant-android-apk-${{ github.sha }}
          name: MynAssistant Android Preview (${{ github.sha }})
          body: |
            Automated debug APK built from ${{ github.ref_name }}.

            The stable debug signing certificate is verified by CI.
            This is a prerelease build, not a Play Store release.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
