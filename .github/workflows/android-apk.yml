name: Build MynAssistant APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-command-status-tracking
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mynassistant-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore repository debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Debug signing key is available."

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists and signature is valid
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(du -h "$APK" | awk '{print $1}')"
          {
            echo "## MynAssistant APK"
            echo
            echo "- Build result: successful"
            echo "- File: `app-debug.apk`"
            echo "- Size: $SIZE"
            echo "- SHA-256: `$SHA256`"
            echo "- Branch: `${GITHUB_REF_NAME}`"
            echo "- Commit: `${GITHUB_SHA}`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK verified. SHA-256: $SHA256"

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MynAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
