name: Android APK

on:
  push:
    branches: [ "main", "feature/android-pc-firebase-bridge" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci-debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Validate Android-to-Windows pairing registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("app/src/main/java/com/mynkralus/mynassistant/MainActivity.kt").read_text(encoding="utf-8")
          required = {
              "Android device registration lifecycle": "Register this Android installation so the Windows app can show it in Telefonlarım.",
              "Stable per-account device identifier": 'val idKey = "android_device_id_" + uid',
              "Android platform marker": '"platform" to "Android"',
              "Authenticated owner identifier": '"ownerId" to uid',
              "Phone heartbeat": "heartbeatHandler.postDelayed(this, 25_000L)",
              "Windows-only remote target list": 'if (!devicePlatform.startsWith("Windows", ignoreCase = true)) return@mapNotNull null',
              "Only server-connected Windows agents are selectable": 'if (connectionMode != "firebase-agent") return@mapNotNull null',
              "Phone sends commands through Firebase": 'FirebaseFirestore.getInstance().collection("commands")',
              "Command payload is sanitized": "sanitizeRemoteCommandPayload(payload)",
              "Server owns command identity metadata": 'commandData["ownerId"] = user.uid',
              "Periodic Android UI liveness refresh": "delay(10_000L)",
              "Time-aware Windows target status": "isOnlineAt(deviceStatusNowMillis)",
              "Offline state on disposal": '"status", "offline"',
              "Safe legacy duplicate cleanup": 'val legacyIdKey = "firebase_android_device_id_" + uid',
              "Legacy record deletion": "legacyDeviceRef.delete()",
              "Legacy ownership guard": 'legacySnapshot.getString("ownerId") == uid',
          }
          missing = [label for label, text in required.items() if text not in source]
          if missing:
              raise SystemExit("Android-PC pairing validation failed; missing: " + ", ".join(missing))

          freshness = Path("app/src/main/java/com/mynkralus/mynassistant/DeviceStatusFreshnessPolicy.kt").read_text(encoding="utf-8")
          freshness_required = {
              "90-second heartbeat freshness policy": "DEVICE_HEARTBEAT_MAX_AGE_MS = 90_000L",
              "Missing heartbeat fails offline": "val lastSeen = lastSeenAtMillis ?: return \"offline\"",
              "Online status uses freshness policy": "normalizeDeviceStatus(",
          }
          missing_freshness = [label for label, text in freshness_required.items() if text not in freshness]
          if missing_freshness:
              raise SystemExit("Android-PC heartbeat freshness validation failed; missing: " + ", ".join(missing_freshness))
          rules = Path("firestore.rules").read_text(encoding="utf-8")
          required_rules = {
              "Command target must belong to the signed-in owner": "get(/databases/$(database)/documents/devices/$(request.resource.data.deviceId)).data.ownerId == request.auth.uid",
              "Command target must use Firebase Agent": "get(/databases/$(database)/documents/devices/$(request.resource.data.deviceId)).data.connectionMode == 'firebase-agent'",
              "Command target must be Windows": "get(/databases/$(database)/documents/devices/$(request.resource.data.deviceId)).data.platform == 'Windows'",
              "Command must enter queue as pending": "request.resource.data.status == 'pending'",
              "Command names are server-whitelisted": "'text_command', 'mute', 'volume_up', 'volume_down'",
              "Command target is immutable": "resource.data.deviceId == request.resource.data.deviceId",
              "Command operation is immutable": "resource.data.command == request.resource.data.command",
          }
          missing_rules = [label for label, text in required_rules.items() if text not in rules]
          if missing_rules:
              raise SystemExit("Firestore command authorization validation failed; missing: " + ", ".join(missing_rules))
          if 'document.getTimestamp("lastSeenAt")?.toDate()?.time' not in source:
              raise SystemExit("Android-PC heartbeat freshness validation failed; Windows targets must use Firestore lastSeenAt.")

          forbidden_direct_transport = [
              "callMynAiBridge(",
              "sendPcBridgeCommand",
              "java.net.URL(endpoint)",
              "mynai-local-bridge",
              '"bridgeUrl"',
          ]
          direct_transport = [marker for marker in forbidden_direct_transport if marker in source]
          if direct_transport:
              raise SystemExit(
                  "Phone-PC architecture violation: direct phone-to-PC transport found: "
                  + ", ".join(direct_transport)
              )

          legacy_registration_markers = [
              'val preferenceKey = "firebase_android_device_id_" + user.uid',
              "saveAndroidDevice(",
          ]
          legacy = [marker for marker in legacy_registration_markers if marker in source]
          if legacy:
              raise SystemExit(
                  "Android-PC pairing validation failed; duplicate legacy registration path found: "
                  + ", ".join(legacy)
              )

          print("Android-PC pairing validation passed: single phone registration, heartbeat, owner scoping, and Windows target filtering.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify built APK manifest
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APK_ANALYZER" ]; then
            echo "::error::apkanalyzer is missing; cannot verify the built APK manifest."
            exit 1
          fi
          "$APK_ANALYZER" manifest print "$APK" > "$RUNNER_TEMP/AndroidManifest.xml"
          python3 - "$RUNNER_TEMP/AndroidManifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          android_ns = "http://schemas.android.com/apk/res/android"
          attr = lambda name: "{" + android_ns + "}" + name
          root = ET.parse(path).getroot()

          permissions = {
              item.get(attr("name"), "")
              for item in root.findall("uses-permission")
          }
          required = {
              "android.permission.RECORD_AUDIO",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.POST_NOTIFICATIONS",
          }
          missing = sorted(required - permissions)
          if missing:
              raise SystemExit("Missing APK permissions: " + ", ".join(missing))

          application = root.find("application")
          if application is None:
              raise SystemExit("APK manifest has no application element.")
          service = next((
              item for item in application.findall("service")
              if item.get(attr("name")) in {
                  ".MynWakeWordService",
                  "com.mynkralus.mynassistant.MynWakeWordService",
              }
          ), None)
          if service is None:
              raise SystemExit("MynWakeWordService is missing from the built APK manifest.")
          foreground_type = service.get(attr("foregroundServiceType"), "")
          # Android's binary manifest decoder may render this flag symbolically or numerically.
          is_microphone_type = foreground_type == "microphone"
          if not is_microphone_type:
              try:
                  is_microphone_type = int(foreground_type, 0) == 0x80
              except ValueError:
                  is_microphone_type = False
          if not is_microphone_type:
              raise SystemExit(
                  "MynWakeWordService must declare microphone foregroundServiceType; got "
                  + repr(foreground_type)
              )
          if service.get(attr("exported")) != "false":
              raise SystemExit("MynWakeWordService must not be exported.")

          uses_sdk = root.find("uses-sdk")
          target_sdk = uses_sdk.get(attr("targetSdkVersion")) if uses_sdk is not None else None
          if target_sdk != "36":
              raise SystemExit("Expected targetSdkVersion 36, got " + str(target_sdk))

          print("APK manifest verified: required permissions, microphone FGS type, non-exported service, targetSdk=36.")
          PY

      - name: Verify APK signing SHA-1
        shell: bash
        run: |
          KEYSTORE_SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA1:/ { gsub(":", "", $2); print tolower($2) }')
          APK_SHA1=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk '/certificate SHA-1 digest/ { print tolower($NF) }' | tr -d ':')
          echo "Debug keystore SHA-1: $KEYSTORE_SHA1"
          echo "APK signing SHA-1:      $APK_SHA1"
          if [ -z "$KEYSTORE_SHA1" ] || [ -z "$APK_SHA1" ] || [ "$KEYSTORE_SHA1" != "$APK_SHA1" ]; then
            echo "::error::APK signing certificate does not match the stable debug keystore."
            exit 1
          fi

      - name: Calculate APK SHA-256
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "APK SHA-256: $SHA256"
          {
            echo "### APK integrity"
            echo
            echo "- File: app/build/outputs/apk/debug/app-debug.apk"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as Actions artifact
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MynAssistant-pc-pairing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases if Actions storage is unavailable
        if: github.event_name != 'pull_request' && steps.upload_apk.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "::error::GitHub Actions artifact storage is unavailable and GH_RELEASE_TOKEN is not configured."
            echo "::error::Add a fine-grained PAT as repository Actions secret GH_RELEASE_TOKEN with Contents: Read and write, then rerun this workflow."
            exit 1
          fi
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          tag="mynassistant-pc-pairing-build-${GH_RUN_ID}-attempt-${GH_RUN_ATTEMPT}"
          notes="Debug/test APK for the MynAssistant Android-PC Firebase pairing branch. Built and validated by GitHub Actions. This is a sideloaded test build, not a Google Play production release. Signing certificate SHA-1 is verified by CI; use the same signing key for later upgrade APKs."

          gh release create "$tag" "$apk" \
            --repo "$GH_REPOSITORY" \
            --target "$GH_SHA" \
            --title "MynAssistant PC Pairing Preview (${GH_RUN_ID})" \
            --notes "$notes" \
            --prerelease

          release_json="$(gh release view "$tag" --repo "$GH_REPOSITORY" --json url,isPrerelease,assets)"
          download_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "app-debug.apk") | .url' | head -n 1)"
          if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
            echo "::error::APK Release asset upload could not be verified."
            exit 1
          fi
          printf 'Verified APK release URL: %s\n' "$download_url"
          printf 'Release metadata: %s\n' "$release_json"
